# Publica o site no GitHub Pages a cada envio de arquivos.
# Antes de publicar, atualiza a lista de obras a partir das pastas de assets/imagens.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar a galeria
        run: |
          pip install pillow
          python tools/gerar_galeria.py

      - name: Reunir os arquivos do site
        run: |
          mkdir _site
          cp -r index.html css js assets _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
